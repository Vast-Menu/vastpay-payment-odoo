services:
  db:
    image: postgres:16
    container_name: db-odoo-19
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:19.0
    container_name: odoo-19
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
      - "8072:8072"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./payment_vastpay:/mnt/extra-addons/payment_vastpay
      - ./.docker/odoo.conf:/etc/odoo/odoo.conf
      - odoo-data:/var/lib/odoo

  tunnel:
    container_name: tunnel-odoo-19
    image: cloudflare/cloudflared:latest
    depends_on:
      - odoo
    command: tunnel --no-autoupdate --url http://odoo:8069

volumes:
  db-data:
  odoo-data:
